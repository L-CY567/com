<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED 点阵仿真面板 · 星闪 NearLink</title>
<style>
  :root {
    --cute-font: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "幼圆", "YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
    --ink: #7a5560;            /* 深可可粉文字 */
    --ink-soft: #c293a3;
    --mint: #a8dcc4;
    --mint-deep: #7cc4a4;
    --pink: #f7b3c8;
    --pink-deep: #ef8aa8;
    --purple: #cdb2ee;
    --purple-deep: #b48ae0;
    --dot-off: #3c2136;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 12% 8%, rgba(255,205,226,.55) 0%, transparent 42%),
      radial-gradient(circle at 90% 90%, rgba(200,236,220,.5) 0%, transparent 45%),
      linear-gradient(150deg, #fde9f1 0%, #fdf1e6 55%, #fbe7ee 100%);
    color: var(--ink);
    font-family: var(--cute-font);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 44px;
  }
  /* 顶部胶囊标题 */
  .title-pill {
    background: linear-gradient(180deg, #ffd9e5, #ffc6d9);
    color: #a44f68;
    border-radius: 999px;
    padding: 12px 36px;
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 8px 16px rgba(240,145,175,.35), inset 0 3px 5px rgba(255,255,255,.85), inset 0 -4px 6px rgba(235,150,175,.4);
    margin-bottom: 8px;
  }
  header p { color: var(--ink-soft); font-size: 13px; margin-bottom: 22px; }
  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 470px) 390px;
    gap: 26px;
    max-width: 960px;
    width: 100%;
  }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  /* 奶油白卡片 */
  .card {
    background: linear-gradient(180deg, #fffdf9, #fdf3e8);
    border-radius: 30px;
    padding: 22px;
    box-shadow: 0 14px 30px rgba(233,170,160,.3), inset 0 3px 5px #ffffff, inset 0 -8px 14px rgba(243,205,190,.35);
  }
  .card + .card { margin-top: 24px; }
  .card h2 {
    font-size: 16px; color: var(--ink); margin-bottom: 16px;
    letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
  }
  .card h2 .badge {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--mint-deep); box-shadow: 0 0 0 4px rgba(168,220,196,.35);
  }
  /* ===== 左侧：电视机造型点阵屏 ===== */
  .tv { position: relative; padding: 34px 22px 30px; }
  .antenna { position: absolute; top: -4px; left: 50%; width: 150px; height: 34px; transform: translateX(-50%); }
  .antenna span {
    position: absolute; bottom: 0; width: 10px; height: 36px;
    background: linear-gradient(180deg, #fbc0d1, #ef8fae);
    border-radius: 6px;
    box-shadow: 0 4px 8px rgba(235,150,175,.4);
  }
  .antenna span:first-child { left: 30px; transform: rotate(-28deg); transform-origin: bottom; }
  .antenna span:last-child  { right: 30px; transform: rotate(28deg); transform-origin: bottom; }
  .tv-body {
    background: linear-gradient(180deg, #ffc9d8, #f7a5bd);
    border-radius: 36px;
    padding: 26px;
    box-shadow: 0 16px 32px rgba(240,155,180,.45), inset 0 4px 8px rgba(255,255,255,.8), inset 0 -10px 18px rgba(230,140,165,.5);
  }
  .screen {
    background: radial-gradient(circle at 30% 25%, #4a2a48 0%, #2c1730 65%);
    border-radius: 24px;
    padding: 16px;
    display: flex; justify-content: center;
    box-shadow: inset 0 6px 18px rgba(0,0,0,.55), 0 4px 10px rgba(220,130,160,.4);
  }
  #matrix { display: grid; gap: 3px; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--dot-off);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
    transition: background .06s, box-shadow .06s;
  }
  .dot.on {
    background: radial-gradient(circle at 35% 30%, #ffb08c, #ff5a45 70%);
    box-shadow: 0 0 6px rgba(255,100,70,.85), 0 0 14px rgba(255,90,60,.4);
  }
  /* 电视脚垫 */
  .feet { display: flex; justify-content: space-around; padding: 0 40px; }
  .feet span {
    width: 34px; height: 16px;
    background: linear-gradient(180deg, #f7a5bd, #ef8fae);
    border-radius: 0 0 12px 12px;
    box-shadow: 0 5px 8px rgba(235,150,175,.4);
  }
  .screen-info {
    display: flex; justify-content: space-between;
    color: var(--ink-soft); font-size: 12px; margin-top: 14px;
    font-family: Consolas, monospace;
  }
  /* ===== 按钮通用（软糖质感） ===== */
  .btn-row { display: flex; gap: 14px; margin-top: 18px; }
  button {
    flex: 1; padding: 13px 0;
    border: none; border-radius: 999px;
    color: #fff; font-size: 15px; font-weight: 800;
    font-family: var(--cute-font); letter-spacing: 2px;
    cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s, filter .15s;
  }
  button:active { transform: scale(.96); }
  #btnBurn {
    background: linear-gradient(180deg, #ffb3c6, #f2809f);
    box-shadow: 0 6px 0 #d96a8b, 0 10px 16px rgba(240,140,170,.4), inset 0 2px 3px rgba(255,255,255,.7);
  }
  #btnBurn:disabled { filter: grayscale(.5) brightness(.95); cursor: not-allowed; }
  #btnReset {
    background: linear-gradient(180deg, #dcc6f4, #b48ae2);
    box-shadow: 0 6px 0 #9a6ec7, 0 10px 16px rgba(190,145,230,.4), inset 0 2px 3px rgba(255,255,255,.7);
  }
  /* 加载动画 */
  #loadBox {
    display: none; margin-top: 18px;
    background: #fff6ef; border-radius: 20px; padding: 14px;
    font-family: Consolas, monospace; font-size: 13px;
    box-shadow: inset 0 2px 6px rgba(235,180,165,.25);
  }
  #loadBox.show { display: block; }
  .load-line { margin: 4px 0; color: #a9788a; white-space: pre-wrap; }
  .load-line.ok { color: #4aa97f; }
  .progress-bar {
    height: 10px; background: #fbe3da; border-radius: 999px;
    overflow: hidden; margin-top: 10px;
    box-shadow: inset 0 2px 4px rgba(220,150,140,.3);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f2809f, #b48ae2);
    border-radius: 999px;
    transition: width .15s linear;
  }
  /* ===== 右侧控件 ===== */
  .field { margin-top: 14px; }
  .field:first-of-type { margin-top: 0; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input[type=text], .field input[type=range] { width: 100%; }
  .field input[type=text] {
    background: #fff; border: none; border-radius: 999px;
    padding: 11px 16px; color: var(--ink); font-size: 14px;
    font-family: var(--cute-font);
    box-shadow: inset 0 3px 6px rgba(235,180,170,.3), 0 2px 4px #fff;
  }
  .field input[type=text]:focus { outline: 3px solid rgba(247,179,200,.5); }
  .mini-btn {
    flex: 0 0 auto; padding: 10px 18px; font-size: 13px; letter-spacing: 1px;
    background: linear-gradient(180deg, #bfe8d2, #93d0b0);
    box-shadow: 0 5px 0 #6fb294, inset 0 2px 3px rgba(255,255,255,.7);
  }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  input[type=range] {
    -webkit-appearance: none; height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #f7b3c8, #cdb2ee);
    box-shadow: inset 0 2px 4px rgba(220,140,160,.35);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffd9e5 60%, #f7b3c8);
    box-shadow: 0 3px 6px rgba(220,140,170,.5);
    cursor: pointer;
  }
  #brightVal, #speedVal { font-size: 13px; width: 52px; text-align: right; color: var(--ink-soft); }
  .row { display: flex; gap: 12px; align-items: center; }
  .pill-toggle {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 10px 14px;
    box-shadow: inset 0 3px 6px rgba(235,180,170,.25);
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { display: none; }
  .slider { position: absolute; inset: 0; background: #f3dbe0; border-radius: 999px; transition: .2s; }
  .slider::before {
    content: ""; position: absolute; width: 16px; height: 16px;
    left: 3px; top: 3px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #f3c3cf);
    box-shadow: 0 2px 4px rgba(200,120,140,.4); transition: .2s;
  }
  .switch input:checked + .slider { background: var(--mint); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  /* 星闪状态 */
  .nearlink-row {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 11px 16px;
    box-shadow: inset 0 3px 6px rgba(235,180,170,.25);
    font-size: 13px;
  }
  .led { width: 12px; height: 12px; border-radius: 50%; background: #ecd2d8; transition: .2s; flex-shrink: 0; }
  .led.blue.on { background: #b48ae2; box-shadow: 0 0 8px #b48ae2; animation: blink 1.6s infinite; }
  .led.green.on { background: #7cc4a4; box-shadow: 0 0 8px #7cc4a4; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .nl-addr { margin-left: auto; color: var(--ink-soft); font-family: monospace; font-size: 12px; }
  /* 串口控制台 */
  #console {
    background: #fff; border-radius: 20px; height: 160px; overflow-y: auto;
    padding: 12px 14px;
    font-family: Consolas, "Courier New", monospace; font-size: 12px;
    color: #b58a9a; line-height: 1.7;
    box-shadow: inset 0 3px 8px rgba(235,180,170,.3);
  }
  #console .t { color: #dcc0c8; }
  #console .info { color: #c58fd6; }
  #console .warn { color: #e8a13a; }
  #console .ok { color: #4aa97f; }
  footer { margin-top: 28px; color: var(--ink-soft); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header style="text-align:center;">
  <div class="title-pill">LED 点阵仿真面板</div>
  <p>NearLink（星闪）教学开发板 · 16×32 点阵屏仿真</p>
</header>

<div class="layout">
  <!-- 左列：小电视 + 烧录/复位 -->
  <div>
    <div class="card tv">
      <div class="antenna"><span></span><span></span></div>
      <div class="tv-body">
        <div class="screen"><div id="matrix"></div></div>
      </div>
      <div class="feet"><span></span><span></span></div>
    </div>

    <div class="card">
      <div class="screen-info">
        <span>RES: 16 × 32</span>
        <span>STATUS: <span id="statusText">POWER_ON</span></span>
      </div>
      <div class="btn-row">
        <button id="btnBurn" onclick="doBurn()">🔥 烧录</button>
        <button id="btnReset" onclick="doReset()">↺ 复位</button>
      </div>
      <div id="loadBox">
        <div id="loadLines"></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>

  <!-- 右列：分组控件 -->
  <div>
    <div class="card">
      <h2><span class="badge"></span>文本与动画</h2>
      <div class="field">
        <label>显示文字（点击"刷新显示"立即生效）</label>
        <div class="row">
          <input type="text" id="textInput" maxlength="64" value="hollowold">
          <button class="mini-btn" onclick="applyText()">刷新显示</button>
        </div>
      </div>
      <div class="field">
        <label class="row" style="justify-content:space-between;">
          <span>滚动字幕</span><span id="speedVal">速度 3</span>
        </label>
        <label class="pill-toggle">
          <span class="switch"><input type="checkbox" id="scrollChk" onchange="toggleScroll(this.checked)"><span class="slider"></span></span>
          滚动开关
        </label>
        <div class="row" style="margin-top:10px;">
          <input type="range" id="scrollSpeed" min="30" max="300" value="120" style="flex:1;" oninput="applySpeed(this.value)">
          <span style="color:#f2809f;">♥</span>
        </div>
      </div>
      <div class="field">
        <label class="row" style="justify-content:space-between;">
          <span>亮度调节</span><span id="brightVal">100%</span>
        </label>
        <input type="range" id="brightSlider" min="10" max="100" value="100" oninput="setBrightness(this.value)">
      </div>
      <div class="field">
        <label>彩蛋</label>
        <label class="pill-toggle">
          <span class="switch"><input type="checkbox" id="catChk" onchange="toggleCat(this.checked)"><span class="slider"></span></span>
          猫咪模式 🐱
        </label>
      </div>
    </div>

    <div class="card">
      <h2><span class="badge" style="background:#b48ae2;box-shadow:0 0 0 4px rgba(205,178,238,.35);"></span>设备连接与串口</h2>
      <div class="field">
        <div class="nearlink-row">
          <span class="led blue" id="nlLed"></span>
          <span>NearLink: <b id="nlText">未连接</b></span>
          <span class="nl-addr" id="nlAddr">--:--:--</span>
        </div>
      </div>
      <div class="field">
        <label>串口控制台（UART0 @ 115200）</label>
        <div id="console"></div>
      </div>
    </div>
  </div>
</div>

<footer>核心点阵渲染逻辑为纯 JS 自实现 · 仅作仿真演示，不涉及真实星闪通信</footer>

<script>
/* ==================== 字模库（5×7 点阵） ==================== */
const FONT = {
  'A':[0x7E,0x11,0x11,0x11,0x7E],'B':[0x7F,0x49,0x49,0x49,0x36],
  'C':[0x3E,0x41,0x41,0x41,0x22],'D':[0x7F,0x41,0x41,0x22,0x1C],
  'E':[0x7F,0x49,0x49,0x49,0x41],'F':[0x7F,0x09,0x09,0x09,0x01],
  'G':[0x3E,0x41,0x49,0x49,0x7A],'H':[0x7F,0x08,0x08,0x08,0x7F],
  'I':[0x00,0x41,0x7F,0x41,0x00],'J':[0x20,0x40,0x41,0x3F,0x01],
  'K':[0x7F,0x08,0x14,0x22,0x41],'L':[0x7F,0x40,0x40,0x40,0x40],
  'M':[0x7F,0x02,0x0C,0x02,0x7F],'N':[0x7F,0x04,0x08,0x10,0x7F],
  'O':[0x3E,0x41,0x41,0x41,0x3E],'P':[0x7F,0x09,0x09,0x09,0x06],
  'Q':[0x3E,0x41,0x51,0x21,0x5E],'R':[0x7F,0x09,0x19,0x29,0x46],
  'S':[0x46,0x49,0x49,0x49,0x31],'T':[0x01,0x01,0x7F,0x01,0x01],
  'U':[0x3F,0x40,0x40,0x40,0x3F],'V':[0x1F,0x20,0x40,0x20,0x1F],
  'W':[0x3F,0x40,0x38,0x40,0x3F],'X':[0x63,0x14,0x08,0x14,0x63],
  'Y':[0x07,0x08,0x70,0x08,0x07],'Z':[0x61,0x51,0x49,0x45,0x43],
  '0':[0x3E,0x51,0x49,0x45,0x3E],'1':[0x00,0x42,0x7F,0x40,0x00],
  '2':[0x42,0x61,0x51,0x49,0x46],'3':[0x21,0x41,0x45,0x4B,0x31],
  '4':[0x18,0x14,0x12,0x7F,0x10],'5':[0x27,0x45,0x45,0x45,0x39],
  '6':[0x3C,0x4A,0x49,0x49,0x30],'7':[0x01,0x71,0x09,0x05,0x03],
  '8':[0x36,0x49,0x49,0x49,0x36],'9':[0x06,0x49,0x49,0x29,0x1E],
  ' ':[0x00,0x00,0x00,0x00,0x00],'-':[0x08,0x08,0x08,0x08,0x08],
  '.':[0x00,0x60,0x60,0x00,0x00],'!':[0x00,0x00,0x5F,0x00,0x00],
  '?':[0x02,0x01,0x51,0x09,0x06],':':[0x00,0x36,0x36,0x00,0x00],
  '*':[0x08,0x2A,0x1C,0x2A,0x08],'#':[0x14,0x7F,0x14,0x7F,0x14],
  '/':[0x20,0x10,0x08,0x04,0x02],'(':[0x00,0x3E,0x41,0x00,0x00],
  ')':[0x00,0x41,0x3E,0x00,0x00],'+':[0x08,0x08,0x3E,0x08,0x08],
  '=':[0x14,0x14,0x14,0x14,0x14],'<':[0x08,0x04,0x02,0x04,0x08],
  '>':[0x08,0x02,0x04,0x08,0x02],'_':[0x40,0x40,0x40,0x40,0x40],
  ',':[0x00,0x00,0x50,0x20,0x00],'\'':[0x00,0x05,0x02,0x00,0x00],
  '"':[0x05,0x05,0x00,0x00,0x00],'@':[0x3E,0x51,0x55,0x51,0x3E],
  '%':[0x45,0x03,0x18,0x60,0x51],'&':[0x1C,0x22,0x1D,0x15,0x1E],
  '~':[0x08,0x04,0x0C,0x10,0x08],'^':[0x02,0x04,0x02,0x00,0x00],
  '♥':[0x0A,0x1F,0x1F,0x0E,0x04],'★':[0x04,0x2A,0x1F,0x2A,0x04],
};
/* —— 默认显示文字：修改这里即可更换 —— */
const DEFAULT_TEXT = "hollowold";

/* ==================== 点阵渲染核心（自实现） ==================== */
const COLS = 32, ROWS = 16;
let offsetX = 0;
let scrollTimer = null, scrollMs = 120;
let curText = DEFAULT_TEXT;
let burning = false;

const matrixEl = document.getElementById('matrix');
matrixEl.style.gridTemplateColumns = `repeat(${COLS}, 11px)`;
const dots = [];
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div');
    d.className = 'dot';
    matrixEl.appendChild(d);
    dots.push(d);
  }
}

function textToGrid(text) {
  const g = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
  const band = [];
  const glyphs = [...text.toUpperCase()].map(ch => FONT[ch] || FONT['?']);
  const y0 = (ROWS - 7) >> 1;
  glyphs.forEach(glyph => {
    glyph.forEach(colByte => band.push(colByte));
    band.push(0x00);
  });
  band.push(0x00, 0x00, 0x00, 0x00);
  for (let c = 0; c < COLS; c++) {
    const byte = band[(offsetX + c) % band.length];
    for (let b = 0; b < 7; b++) if (byte & (1 << b)) g[y0 + b][c] = 1;
  }
  return g;
}

function render() {
  if (catMode) { renderCatOverlay(); return; }
  const g = textToGrid(curText);
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const d = dots[r * COLS + c];
      d.classList.toggle('on', g[r][c] === 1);
      if (g[r][c] === 1) {
        d.style.background = textColor(c);
        d.style.boxShadow = '0 0 4px rgba(255,255,255,.35)';
      } else { d.style.background = ''; d.style.boxShadow = ''; }
    }
}

/* ==================== 迷你小猫（字幕下方走动，隔几秒快速跳一下） ==================== */
/* '#'=猫身(渐变)  'o'=眼睛  't'=鼻子  '.'=透明 */
const CAT_ART = [
  ".#..#.",
  "######",
  "#o##o#",
  ".####.",
];
const CAT_H = 4, CAT_W = 6;
let catMode = false;
let catTimer = null;
let catX = 0, catDir = 1, catY = 0;
let catState = 'walk', stateUntil = 0, jumpStart = 0, jumpDur = 500, jumpPeak = 8;

// 字幕文字渐变：米白 -> 浅薄荷 -> 粉 -> 粉紫（按屏幕列横向渐变）
const TEXT_STOPS = ['#fff4e3', '#cdeedd', '#f7b3c8', '#cdb2ee'];
function multiLerp(stops, t) {
  const n = stops.length - 1;
  const seg = Math.min(n - 1, Math.floor(t * n));
  return lerpHex(stops[seg], stops[seg + 1], t * n - seg);
}
function textColor(c) { return multiLerp(TEXT_STOPS, c / (COLS - 1)); }

// 猫身渐变：浅薄荷 -> 奶油白 -> 浅粉
function lerpHex(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function catBodyColor(r) {
  const t = Math.min(1, Math.max(0, r / (CAT_H - 1)));
  return t < 0.5 ? lerpHex('#cdeedd', '#fff4e3', t * 2)
                 : lerpHex('#fff4e3', '#f7b3c8', (t - 0.5) * 2);
}

/* 猫叠加层：字幕像素保持点亮（文字渐变色），猫在地面上走 */
function renderCatOverlay() {
  const baseGrid = textToGrid(curText);
  const groundY = ROWS - CAT_H;
  const y0 = groundY - catY;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const d = dots[r * COLS + c];
      const ch = (r >= y0 && r < y0 + CAT_H && c >= catX && c < catX + CAT_W)
        ? CAT_ART[r - y0][c - catX] : '.';
      if (ch === 'o') { d.classList.remove('on'); d.style.background = '#7a5560'; d.style.boxShadow = 'none'; }
      else if (ch === '#') {
        d.classList.add('on');
        d.style.background = catBodyColor(r - y0);
        d.style.boxShadow = '0 0 4px rgba(255,255,255,.35)';
      } else {
        d.classList.toggle('on', baseGrid[r][c] === 1);
        if (baseGrid[r][c] === 1) {
          d.style.background = textColor(c);
          d.style.boxShadow = '0 0 4px rgba(255,255,255,.35)';
        } else { d.style.background = ''; d.style.boxShadow = ''; }
      }
    }
}

/* 行为状态机：走动(长 2.2~4s) -> 快速跳一下(~0.5s) -> 再走动，循环 */
function catTick() {
  const now = performance.now();
  if (catState === 'walk') {
    catX += catDir;
    if (catX <= 0 || catX >= COLS - CAT_W) catDir *= -1;   // 走到边缘折返
    if (now >= stateUntil) {
      catState = 'jump';
      jumpStart = now;
      jumpDur = 450 + Math.random() * 150;                 // 跳：很短 ~0.5s
      jumpPeak = 7 + Math.floor(Math.random() * 3);        // 跳得够高穿过字幕
    }
  } else {
    const p = (now - jumpStart) / jumpDur;
    if (p >= 1) {
      catState = 'walk'; catY = 0;
      stateUntil = now + 2200 + Math.random() * 1800;      // 走：时间长
    } else {
      catY = Math.round(Math.sin(Math.PI * p) * jumpPeak);
    }
  }
  render();
}
function startCatBounce() {
  stopCatBounce();
  catState = 'walk'; catY = 0;
  stateUntil = performance.now() + 2500;
  catTimer = setInterval(catTick, 50);
}
function stopCatBounce() { if (catTimer) { clearInterval(catTimer); catTimer = null; } }

function toggleCat(on) {
  catMode = on;
  catX = 0; catDir = 1; catY = 0;
  if (on) { startCatBounce(); if (document.getElementById('scrollChk').checked) startScroll(); log('猫咪模式: 喵~ 小猫在字幕下方散步，隔几秒跳一下', 'ok'); }
  else { stopCatBounce(); log('猫咪模式: 关闭', 'info'); }
  render();
}

function clearScreen() { dots.forEach(d => d.classList.remove('on')); }

// 点阵自适应缩放：确保始终完整落在电视机屏幕内
function fitMatrix() {
  const screen = matrixEl.parentElement;
  const mw = COLS * 11 + (COLS - 1) * 3;
  const scale = Math.min(1, (screen.clientWidth - 8) / mw);
  matrixEl.style.transformOrigin = 'center';
  matrixEl.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitMatrix);

function setBrightness(v) {
  document.getElementById('brightVal').textContent = v + '%';
  matrixEl.style.filter = `brightness(${v}%)`;
}

/* ==================== 串口控制台 ==================== */
const consoleEl = document.getElementById('console');
function log(msg, cls = '') {
  const t = new Date().toLocaleTimeString('zh-CN', {hour12: false});
  const div = document.createElement('div');
  div.innerHTML = `<span class="t">[${t}]</span> <span class="${cls}">${msg}</span>`;
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ==================== 烧录流程 ==================== */
function doBurn() {
  if (burning) return;
  burning = true;
  document.getElementById('btnBurn').disabled = true;
  document.getElementById('statusText').textContent = 'BUILDING';
  document.getElementById('loadBox').classList.add('show');
  document.getElementById('loadLines').innerHTML = '';
  document.getElementById('progFill').style.width = '0%';

  const text = document.getElementById('textInput').value || DEFAULT_TEXT;
  const steps = [
    ['> nearlink-cli build ./src/main.c', ''],
    ['[CC]  main.c -> main.o', ''],
    ['[CC]  font_data.c -> font_data.o', ''],
    ['[CC]  matrix_driver.c -> matrix_driver.o', ''],
    ['[LD]  linking... led_matrix.elf', ''],
    ['[OK]  编译完成，固件大小 12.6 KB', 'ok'],
    ['> nearlink-cli flash --port COM3 --baud 115200', ''],
    ['Connecting to chip ... OK', ''],
    ['Erasing flash ...... done', ''],
    ['Writing firmware [====] 12.6/12.6 KB', ''],
    ['Verifying ............ OK', 'ok'],
    ['[OK]  烧录成功，正在重启设备...', 'ok'],
  ];
  let i = 0;
  const fill = document.getElementById('progFill');
  const timer = setInterval(() => {
    if (i < steps.length) {
      const div = document.createElement('div');
      div.className = 'load-line ' + steps[i][1];
      div.textContent = steps[i][0];
      document.getElementById('loadLines').appendChild(div);
      log(steps[i][0], steps[i][1] === 'ok' ? 'ok' : 'info');
      fill.style.width = Math.round(((i + 1) / steps.length) * 100) + '%';
      i++;
    } else {
      clearInterval(timer);
      setTimeout(() => {
        document.getElementById('loadBox').classList.remove('show');
        burning = false;
        document.getElementById('btnBurn').disabled = false;
        document.getElementById('statusText').textContent = 'RUNNING';
        curText = text; offsetX = 0;
        catMode = false; document.getElementById('catChk').checked = false;
        render();
        setBrightness(document.getElementById('brightSlider').value);
        if (document.getElementById('scrollChk').checked) startScroll();
        log(`屏幕显示: "${text}"`, 'ok');
        connectNearLink();
      }, 400);
    }
  }, 260);
}

/* ==================== 复位 ==================== */
function doReset() {
  if (burning) return;
  stopScroll();
  curText = DEFAULT_TEXT; offsetX = 0;
  catMode = false; document.getElementById('catChk').checked = false;
  clearScreen();
  document.getElementById('statusText').textContent = 'POWER_ON';
  log('设备复位 → 清空屏幕，回到上电初始状态', 'warn');
  disconnectNearLink();
}

/* ==================== 自定义文字 ==================== */
function applyText() {
  if (burning) return;
  const v = document.getElementById('textInput').value.trim();
  if (!v) return;
  curText = v; offsetX = 0;
  catMode = false; document.getElementById('catChk').checked = false;
  render();
  document.getElementById('statusText').textContent = 'RUNNING';
  log(`更新显示内容: "${v}"`, 'info');
}

/* ==================== 滚动字幕 ==================== */
function startScroll() { stopScroll(); scrollTimer = setInterval(() => { offsetX++; render(); }, scrollMs); }
function stopScroll() { if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; } }
function toggleScroll(on) {
  if (on) { startScroll(); log('滚动字幕: 开启', 'info'); }
  else { stopScroll(); offsetX = 0; render(); log('滚动字幕: 关闭', 'info'); }
}
function applySpeed(v) {
  scrollMs = 360 - Number(v);
  document.getElementById('speedVal').textContent =
    '速度 ' + (Math.round((Number(v) - 30) / 270 * 8) + 1);
  if (scrollTimer) startScroll();
}

/* ==================== 星闪状态（模拟） ==================== */
function connectNearLink() {
  document.getElementById('nlLed').classList.add('on');
  document.getElementById('nlText').textContent = '已连接 (SLB@1Mbps)';
  document.getElementById('nlAddr').textContent =
    'NL:' + Array.from({length: 4}, () => Math.floor(Math.random()*256).toString(16).padStart(2,'0').toUpperCase()).join(':');
  log('NearLink 链路已建立，进入业务态', 'ok');
}
function disconnectNearLink() {
  document.getElementById('nlLed').classList.remove('on');
  document.getElementById('nlText').textContent = '未连接';
  document.getElementById('nlAddr').textContent = '--:--:--';
}

/* ==================== 启动 ==================== */
setBrightness(100);
applySpeed(120);
fitMatrix();
log('系统上电，等待烧录... (默认固件文本: "' + DEFAULT_TEXT + '")', 'info');
log('提示：修改源码中 DEFAULT_TEXT 常量即可更换文字', '');
if (new URLSearchParams(location.search).has('autoburn')) setTimeout(doBurn, 500);
if (new URLSearchParams(location.search).has('cat')) setTimeout(() => {
  const p = new URLSearchParams(location.search);
  document.getElementById('catChk').checked = true; toggleCat(true);
  if (p.has('scroll')) { document.getElementById('scrollChk').checked = true; toggleScroll(true); }
}, 300);
</script>
